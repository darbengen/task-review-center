<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#202123);--panel:light-dark(#fff,#28292b);--text:light-dark(#252629,#eee);--muted:light-dark(#85868a,#a3a4a9);--line:light-dark(#e9e9eb,#393a3e);--orange:light-dark(#b76320,#eea559);--green:light-dark(#27804f,#75c992);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:3px}#app{height:100vh;height:100dvh;min-height:0;min-width:600px;overflow:hidden;display:flex;flex-direction:column}header,.filters,.filter-extra,#notice,#toast,.footer{flex-shrink:0}header{padding:30px 30px 22px}h1{font-size:26px;letter-spacing:-.6px;margin:0 0 10px;font-weight:650}.intro{font-size:13px;color:var(--muted);margin:0}.filters{display:flex;gap:12px;align-items:center;padding:0 30px 22px}input[type=search]{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:10px 12px;min-width:150px;flex:1;max-width:380px}select{max-width:180px;min-width:90px;padding:9px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--panel)}.archive{font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}.refresh{margin-left:auto}.quiet{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:7px;font-size:12px}.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);border-top:1px solid var(--line);flex:1 1 0;min-height:0;overflow:hidden}.column{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.column+.column{border-left:1px solid var(--line)}.column-head{padding:23px 24px 18px;flex-shrink:0}.column-head h2{display:flex;gap:9px;align-items:center;font-size:17px;font-weight:600;margin:0}.dot{height:10px;width:10px;border:2px solid currentColor;border-radius:50%;display:inline-block}.done .dot{background:var(--green)}.count{font-size:12px;border-radius:20px;padding:3px 8px;background:color-mix(in srgb,currentColor 10%,transparent)}.column-head p{font-size:12px;color:var(--muted);margin:8px 0 0}.pending h2 .dot,.pending .count{color:var(--orange)}.done h2 .dot,.done .count{color:var(--green)}.cards{overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;min-height:0;flex:1 1 0;padding:0 18px 22px;scrollbar-width:thin}.card{border:1px solid var(--line);border-radius:10px;padding:17px;margin-bottom:11px;background:var(--panel)}.title{font-size:14px;font-weight:550;line-height:1.6;background:none;border:0;padding:0;text-align:left;width:100%;overflow-wrap:anywhere;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.pending .title{color:var(--orange)}.done .title{color:var(--green)}.arrow{color:var(--muted);font-size:13px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin:13px 0}.project-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{white-space:nowrap}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{font-size:11px;color:var(--muted)}.action{border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--text) 5%,var(--bg));color:var(--text);font-size:12px;padding:6px 12px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:70px 20px;line-height:1.8}.empty b{display:block;font-size:30px;font-weight:300;margin-bottom:12px}.footer{display:flex;gap:12px;align-items:center;padding:10px 30px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.footer span:last-child{margin-left:auto}#notice{display:none;padding:12px 30px;background:color-mix(in srgb,var(--orange .filter-extra{display:flex;gap:10px;align-items:center;padding:0 30px 20px}.filter-extra select{max-width:220px;font-size:12px}.filters{padding-bottom:10px}.card-top{display:flex;align-items:flex-start;gap:6px}.star{padding:1px 4px;font-size:18px;border:0;background:none;color:var(--muted)}.star[aria-pressed=true]{color:var(--orange)}.text-button{border:0;background:none;padding:4px 0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}.text-button:hover{color:var(--text)}.note-preview{margin:0 0 13px;padding:9px 10px;border-radius:6px;background:color-mix(in srgb,var(--text) 4%,var(--bg));font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto}.note-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:12px;resize:vertical;min-height:65px}.note-actions{display:flex;justify-content:flex-end;gap:14px;margin:6px 0 14px}.changed{font-size:11px;color:var(--orange);margin:0 0 10px}.title{flex:1;min-width:0}.card:focus-within{border-color:color-mix(in srgb,var(--orange) 45%,var(--line))}@media(max-width:800px){header{padding:22px 20px 16px}.filters,.filter-extra{padding-left:20px;padding-right:20px;gap:8px}.column-head{padding-left:18px}.cards{padding-left:12px;padding-right:12px}.card{padding:13px}.archive{font-size:11px}}
.action-group{display:flex;gap:8px;align-items:center}.archive-task{background:none;color:var(--muted)}.archive-task:hover{color:var(--text)}dialog{width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--text);background:var(--panel);box-shadow:0 12px 48px #0003}dialog::backdrop{background:#0005}dialog h2{margin:0 0 14px;font-size:19px}dialog p{font-size:13px;line-height:1.8;margin:12px 0;color:var(--muted)}#archive-title{font-size:14px;line-height:1.6;font-weight:550;overflow-wrap:anywhere;color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#archive-confirm{background:var(--text);color:var(--bg);border-color:var(--text)}#archive-error{color:var(--orange)}dialog button:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

.filter-summary{flex-shrink:0;margin:0;padding:0 30px 12px;color:var(--orange);font-size:12px;line-height:1.5}.filter-summary[hidden]{display:none}#catalog-summary{line-height:1.5}@media(max-width:800px){.filter-summary{padding-left:20px;padding-right:20px}}
</style></head><body><main id="app">
<header><h1>任务中心</h1><p class="intro" id="catalog-summary">正在核对任务与聊天总数…</p></header>
<div class="filters"><input id="search" type="search" placeholder="搜索任务与聊天" aria-label="搜索任务与聊天"><select id="project" aria-label="Work / Codex 项目筛选"><option value="">全部项目</option></select><label class="archive"><input id="archived" type="checkbox">包含归档</label><button id="refresh" class="quiet refresh">刷新</button></div>
<div class="filter-extra"><select id="focus" aria-label="审查范围"><option value="all">全部任务</option><option value="starred">只看置顶</option><option value="stale">7 天未更新的待审查</option><option value="changed">确认后有新进展</option></select><select id="sort" aria-label="待审查排序"><option value="recent">最近更新优先</option><option value="oldest">最久未审优先</option></select><button id="clear-filters" class="text-button" hidden>清除筛选</button></div>
<p id="filter-summary" class="filter-summary" role="status" hidden></p>
<div id="notice" role="alert" title="点击关闭操作提示"></div>
<div class="board"><section class="column pending"><div class="column-head"><h2><i class="dot"></i>待审查 <span class="count" id="pending-count">0</span></h2><p>Work / Codex · 等你确认</p></div><div class="cards" id="pending" role="region" aria-label="待审查任务" tabindex="0"></div></section><section class="column done"><div class="column-head"><h2><i class="dot"></i>已完成 <span class="count" id="done-count">0</span></h2><p>Work / Codex · 已确认成果</p></div><div class="cards" id="done" role="region" aria-label="已完成任务" tabindex="0"></div></section><section class="column chat"><div class="column-head"><h2><i class="dot"></i>聊天 <span class="count" id="chat-count">0</span></h2><p>ChatGPT Chat · 当前账号</p></div><div class="chat-controls"><select id="chat-status" aria-label="聊天审查状态"><option value="all">全部聊天</option><option value="pending">待确认</option><option value="done">已完成</option></select></div><div class="cards" id="chat" role="region" aria-label="ChatGPT 聊天" tabindex="0"></div><div id="chat-sync" class="chat-sync" role="status">正在读取应用聊天列表…</div></section></div>
<div id="toast" role="status"><span id="toast-text"></span><button id="undo">撤销</button><button id="toast-close" aria-label="关闭提示">×</button></div>
<div class="footer"><span id="sync">正在连接任务列表…</span><span>确认只改变任务分类</span></div>
</main>
<dialog id="archive-dialog" aria-labelledby="archive-heading" aria-describedby="archive-description">
<h2 id="archive-heading">归档这个任务？</h2><div id="archive-title"></div>
<p id="archive-description">归档后，此聊天会从侧边栏和任务中心默认列表中隐藏。聊天记录与已保存的审查备注会保留，可勾选“包含归档”查看；不会移到“已完成”。</p>
<p id="archive-error" role="alert" hidden></p><div class="dialog-actions"><button id="archive-cancel" class="quiet" autofocus>取消</button><button id="archive-confirm" class="action">确认归档</button></div>
</dialog><script>
(() => {
  'use strict';
  let state = {tasks: [], chats: [], syncedAt: null}, undo = null, loading = false;
  let serial = 0, initialized = false, mode = null, interval = null;
  let actionError = '', syncError = '', lastSignature = '';
  let archiveRequest = null, archiving = false;
  let chatConnection = 'connecting';
  const legacyMessage = '当前仍是旧连接，尚不能读取 Chat。请在其他任务结束后，完全退出应用并重新启动；只重新打开任务中心不会更新旧连接。';
  const waits = new Map(), busy = new Set(), localReviews = new Map();
  const drafts = new Map(), editors = new Set();
  const $ = id => document.getElementById(id);
  const preferenceKey = 'task-review-center:view:v1';
  const allTasks = () => [...state.tasks, ...state.chats];
  const findTask = id => allTasks().find(t => t.id === id);

  function showErrors() {
    $('notice').textContent = actionError || syncError;
    $('notice').style.display = (actionError || syncError) ? 'block' : 'none';
  }
  function error(message) { actionError = message || ''; showErrors(); }
  function rpc(method, params = {}) {
    return new Promise((resolve, reject) => {
      const id = ++serial;
      const timer = setTimeout(() => { waits.delete(id); reject(new Error('界面连接超时，请重新打开任务中心。')); }, 30000);
      waits.set(id, {resolve, reject, timer});
      window.parent.postMessage({jsonrpc: '2.0', id, method, params}, '*');
    });
  }
  function theme(context) {
    if (['dark', 'light'].includes(context?.theme)) document.documentElement.style.colorScheme = context.theme;
  }
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (!m.method && m.id != null && waits.has(m.id)) {
      const p = waits.get(m.id); waits.delete(m.id); clearTimeout(p.timer);
      m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') ingest(m.params?.structuredContent);
    if (m.method === 'ui/notifications/host-context-changed') theme(m.params);
    if (m.method === 'ui/resource-teardown' && m.id != null) {
      clearInterval(interval);
      window.parent.postMessage({jsonrpc: '2.0', id: m.id, result: {}}, '*');
    }
  });
  window.addEventListener('openai:set_globals', e => { theme(e.detail?.globals); ingest(e.detail?.globals?.toolOutput); });
  async function call(name, args = {}) {
    const result = mode === 'skybridge' ? await window.openai.callTool(name, args) : await rpc('tools/call', {name, arguments: args});
    if (result?.isError) throw new Error(result.content?.find(x => x.type === 'text')?.text || '操作失败，请刷新核对状态。');
    return result?.structuredContent ?? result;
  }
  function changed(task) {
    const baseline = task.review.reviewedUpdatedAt ?? task.review.confirmedAt;
    return task.review.status === 'done' && baseline != null && task.updatedAt > baseline;
  }
  function ingest(data, fullList = null) {
    if (data?.structuredContent) data = data.structuredContent;
    if (!Array.isArray(data?.tasks)) return;
    // Work archive responses intentionally omit Chat; a full list must include it.
    if (fullList === null) fullList = !(data.archived === true && typeof data.threadId === 'string');
    if (fullList && !Object.hasOwn(data, 'chats')) {
      chatConnection = 'legacy';
      data = {...data, chats: [], chatSource: null, chatSyncedAt: null, chatSyncError: null, chatAccountCheckedAt: state.chatAccountCheckedAt};
    } else if (Array.isArray(data.chats)) chatConnection = 'ready';
    // A delayed snapshot must not undo an acknowledged review or note in this window.
    const mergeReviews = tasks => tasks.map(t => {
      const previous = findTask(t.id)?.review;
      const local = localReviews.get(t.id);
      const acknowledged = local && (!previous || local.revision >= previous.revision) ? local : previous;
      if (acknowledged && acknowledged.revision > t.review.revision) return {...t, review: acknowledged};
      if (acknowledged) localReviews.delete(t.id);
      return t;
    });
    // Local-only responses (such as Work archival) must not reset the Chat column.
    if (Object.hasOwn(data, 'chats') && state.chatAccountCheckedAt && (!data.chatAccountCheckedAt || data.chatAccountCheckedAt < state.chatAccountCheckedAt)) {
      data = {...data, chats: state.chats, chatSource: state.chatSource, chatSyncedAt: state.chatSyncedAt, chatSyncError: state.chatSyncError, chatAccountCheckedAt: state.chatAccountCheckedAt};
    }
    const oldAccount = state.chatSource?.accountId, newAccount = data.chatSource?.accountId;
    const accountChanged = Object.hasOwn(data, 'chats') && oldAccount !== newAccount;
    if (accountChanged) {
      for (const task of state.chats) { drafts.delete(task.id); editors.delete(task.id); localReviews.delete(task.id); }
      if (undo && state.chats.some(t => t.id === undo.threadId)) { undo = null; $('toast').style.display = 'none'; }
    }
    const chatData = Object.hasOwn(data, 'chats') ? {
      chats: mergeReviews(Array.isArray(data.chats) ? data.chats : []), chatSource: data.chatSource,
      chatSyncedAt: data.chatSyncedAt, chatSyncError: data.chatSyncError,
      chatAccountCheckedAt: data.chatAccountCheckedAt,
    } : {chats: state.chats, chatSource: state.chatSource, chatSyncedAt: state.chatSyncedAt, chatSyncError: state.chatSyncError, chatAccountCheckedAt: state.chatAccountCheckedAt};
    // Chat sync proceeds independently while Work is offline, and vice versa.
    if (!accountChanged && state.chatSyncedAt && chatData.chatSyncedAt && chatData.chatSyncedAt < state.chatSyncedAt) {
      Object.assign(chatData, {chats: state.chats, chatSource: state.chatSource, chatSyncedAt: state.chatSyncedAt, chatSyncError: state.chatSyncError});
    }
    data = {...data, ...chatData, tasks: mergeReviews(data.tasks)};
    if (state.syncedAt && data.syncedAt && data.syncedAt < state.syncedAt) data = {...data, tasks: state.tasks, syncedAt: state.syncedAt, syncError: state.syncError};
    state = data;
    const signature = JSON.stringify([data.tasks, data.chats, data.chatSyncError, data.chatSource, chatConnection, Math.floor(Date.now() / 60000)]);
    if (signature !== lastSignature) { lastSignature = signature; renderProjects(); render(); }
    syncError = data.syncError ? '同步暂未完成：' + data.syncError + ' 已保留上次任务列表。' : '';
    showErrors();
    $('chat-sync').dataset.error = String(chatConnection === 'legacy' || !!data.chatSyncError);
    $('chat-sync').textContent = chatConnection === 'legacy' ? legacyMessage : data.chatSyncError ? data.chatSyncError + (data.chats.length ? ' 已保留上次聊天列表。' : '')
      : !data.chatSource ? '聊天栏尚未连接，请重新打开任务中心。'
      : (data.chatSource.complete ? '跟随应用聊天列表更新' : '应用正在补齐聊天历史，目前显示已同步部分') + ' · 归档聊天不在此列';
    const stale = data.syncedAt && Date.now() / 1000 - data.syncedAt > 60;
    $('sync').textContent = data.syncedAt
      ? (stale ? '上次同步 ' : '更新于 ') + new Date(data.syncedAt * 1000).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + (stale ? ' · 可点击刷新' : ' · 自动同步')
      : '等待任务同步';
  }
  async function refresh(force = false) {
    if (loading || !initialized || document.hidden) return;
    loading = true; $('refresh').disabled = true;
    try { ingest(await call('list_tasks', {refresh: force}), true); }
    catch (e) { syncError = e.message; showErrors(); }
    finally { loading = false; $('refresh').disabled = false; }
  }
  function savePreferences() {
    try { localStorage.setItem(preferenceKey, JSON.stringify({search: $('search').value, project: $('project').value, archived: $('archived').checked, focus: $('focus').value, sort: $('sort').value, 'chat-status': $('chat-status').value})); } catch (_) { /* Sandboxed hosts may not expose storage. */ }
  }
  function restorePreferences() {
    try {
      const value = JSON.parse(localStorage.getItem(preferenceKey) || '{}');
      for (const id of ['search', 'focus', 'sort', 'chat-status']) if (typeof value[id] === 'string') $(id).value = value[id];
      if (!$('focus').value) $('focus').value = 'all';
      if (!$('sort').value) $('sort').value = 'recent';
      if (!$('chat-status').value) $('chat-status').value = 'all';
      $('archived').checked = value.archived === true;
      if (typeof value.project === 'string' && value.project) $('project').append(new Option(value.project.split('/').pop(), value.project, true, true));
    } catch (_) { /* Invalid view preferences never affect review records. */ }
  }
  function renderProjects() {
    const selected = $('project').value, paths = [...new Set(state.tasks.map(t => t.cwd))].sort();
    const names = paths.map(path => path.split('/').filter(Boolean).pop() || '未指定项目');
    const fragment = document.createDocumentFragment(); fragment.append(new Option('全部项目', ''));
    for (const [i, path] of paths.entries()) fragment.append(new Option(names.filter(n => n === names[i]).length > 1 ? path : names[i], path));
    // Keep a selected project visible even while its source is temporarily unavailable.
    if (selected && !paths.includes(selected)) fragment.append(new Option(selected + '（当前无任务）', selected));
    $('project').replaceChildren(fragment); $('project').value = selected;
  }
  function age(timestamp) {
    if (!timestamp) return '';
    const seconds = Math.max(0, Date.now() / 1000 - timestamp);
    if (seconds < 60) return '刚刚'; if (seconds < 3600) return Math.floor(seconds / 60) + ' 分钟前';
    if (seconds < 86400) return Math.floor(seconds / 3600) + ' 小时前';
    if (seconds < 86400 * 7) return Math.floor(seconds / 86400) + ' 天前';
    return new Date(timestamp * 1000).toLocaleDateString('zh-CN', {month: 'short', day: 'numeric'});
  }
  function node(tag, cls, text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; }
  async function openThread(task) {
    try {
      savePreferences();
      const url = task.source === 'chatgpt' ? 'https://chatgpt.com/c/' + encodeURIComponent(task.conversationId) : 'codex://threads/' + encodeURIComponent(task.id);
      const result = mode === 'skybridge' ? await window.openai.openExternal({href: url}) : await rpc('ui/open-link', {url});
      if (result?.isError) throw new Error('当前宿主未允许打开聊天链接。');
    } catch (e) { error('打开聊天失败：' + e.message); }
  }
  function keyed(el, task, kind) { el.dataset.key = task.id + ':' + kind; return el; }
  function card(task) {
    const done = task.review.status === 'done', chat = task.source === 'chatgpt', box = node('article', 'card' + (done ? ' is-done' : ''));
    const top = node('div', 'card-top'), title = keyed(node('button', 'title'), task, 'title');
    title.setAttribute('aria-label', '打开聊天：' + task.title);
    if (chat) title.title = '打开 ChatGPT 原对话链接，按应用的链接设置打开';
    title.append(node('span', '', task.title), node('span', 'arrow', '↗')); title.onclick = () => openThread(task);
    const star = keyed(node('button', 'star', task.review.starred ? '★' : '☆'), task, 'star');

  function render() {

    if (focus === 'stale') chats = chats.filter(t => t.review.status === 'pending' && Date.now() / 1000 - t.updatedAt >= 7 * 86400);
    if (focus === 'changed') chats = chats.filter(changed);

    $('catalog-summary').textContent = '已登记 ' + state.tasks.length + ' 个任务 · ' + chatTotal + ' · 其中归档 ' + archivedCount + ' 个任务';
    const filters = [];

    if (project) filters.push('项目：' + $('project').selectedOptions[0].textContent + '（仅任务）');
    if (includeArchived) filters.push('包含归档');
    if (focus !== 'all') filters.push($('focus').selectedOptions[0].textContent);
    if (chatStatus !== 'all') filters.push('聊天：' + $('chat-status').selectedOptions[0].textContent);

      empty.append(node('b', '', chatConnection === 'legacy' ? '!' : '◌'), node('span', '', chatConnection === 'legacy' ? '旧连接尚未更新，请查看下方提示' : state.chatSyncError ? '聊天列表暂时不可用，请查看下方提示' : state.chats.length ? '没有符合条件的聊天' : state.chatSource ? '应用同步的新 Chat 对话会出现在这里' : '正在连接 Chat 聊天列表'));

  async function mutate(id, tool, args, kind) {

      if (current && result.record.revision >= current.review.revision) current.review = result.record;

  function focusArchiveOrigin(id) {

    (button || $('archived')).focus({preventScroll: true});
  }
  function openArchive(id) {
    if (archiveRequest || busy.has(id)) return;
    const task = state.tasks.find(t => t.id === id);
    if (!task || task.archived || task.review.status !== 'pending') return;
    if (drafts.has(id) && drafts.get(id) !== (task.review.note || '')) {
